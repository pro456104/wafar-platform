schema_version: "1.0"
workflow:
  id: "speckit"
  name: "Full SDD Cycle"
  version: "1.1.0"
  author: "GitHub"
  description: "Runs constitution → specify → clarify → plan → checklist → tasks → analyze → implement → converge with review gates; implement and converge repeat until converge reports Converged (ADR-013)"

requires:
  # ">=1.1.0" matches the pinned install (ADR-021); 0.8.5 was the first
  # release with engine-side resolution of the ``integration: "auto"``
  # default, but the project install is pinned higher.
  speckit_version: ">=1.1.0"
  integrations:
    # The commands below are provided by every integration. The list here is an
    # advisory, non-exhaustive compatibility hint following the documented
    # ``any: [...]`` schema -- it is NOT a closed set. The workflow runs
    # against any integration the project was initialized with, including
    # ones not listed below, as long as that integration provides the
    # commands referenced in ``steps``.
    any:
      - "alquimia"
      - "claude"
      - "cline"
      - "copilot"
      - "gemini"
      - "opencode"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use (e.g. claude, copilot, gemini; 'auto' uses the project's initialized integration)"

steps:
  - id: constitution
    command: speckit.constitution
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  # git extension hooks (auto-executed by engine; defined in .specify/extensions.yml)
  # before_constitution: speckit.git.initialize (mandatory, no-op if repo exists)
  # before_specify: speckit.git.feature (mandatory, creates feature branch)
  # before_specify: speckit.assess.intake (optional, enabled; prompts to normalize a raw idea)

  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Review the generated spec before clarifying."
    options: [approve, reject]
    on_reject: abort

  - id: clarify
    command: speckit.clarify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  # git extension hooks (auto-executed; auto_commit default=false in git-config.yml)
  # before_clarify: speckit.git.commit (optional, disabled by default)
  # after_specify: speckit.git.commit (optional, disabled by default)

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  # git extension hooks (auto-executed; auto_commit default=false)
  # before_plan: speckit.git.commit (optional, disabled by default)
  # after_plan: speckit.git.commit (optional, disabled by default)

  - id: review-plan
    type: gate
    message: "Review the plan before checklist."
    options: [approve, reject]
    on_reject: abort

  - id: checklist
    command: speckit.checklist
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  # git extension hooks (auto-executed; auto_commit default=false)
  # before_checklist: speckit.git.commit (optional, disabled by default)
  # after_checklist: speckit.git.commit (optional, disabled by default)

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  # git extension hooks (auto-executed; auto_commit default=false)
  # before_tasks: speckit.git.commit (optional, disabled by default)
  # after_tasks: speckit.git.commit (optional, disabled by default)

  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  # git extension hooks (auto-executed; auto_commit default=false)
  # before_analyze: speckit.git.commit (optional, disabled by default)
  # after_analyze: speckit.git.commit (optional, disabled by default)

  - id: gate-pre-implement
    type: gate
    message: "Resolve analyze findings before implementing."
    options: [approve, reject]
    on_reject: abort

  # git extension hooks (auto-executed; auto_commit default=false)
  # before_implement: speckit.git.commit (optional, disabled by default)
  # after_implement: speckit.git.commit (optional, disabled by default)

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  # git extension hooks (auto-executed; auto_commit default=false)
  # before_taskstoissues: speckit.git.commit (optional, disabled by default)
  # after_taskstoissues: speckit.git.commit (optional, disabled by default)
  # after_implement: speckit.git.commit (optional, disabled by default)

  - id: converge
    command: speckit.converge
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  # ADR-013: implement and converge repeat (implement ↔ converge) until converge
  # reports Converged; a feature is Converged only when converge says so.

  # git extension hooks (auto-executed; auto_commit default=false)
  # after_converge: speckit.git.commit (optional, disabled by default)
